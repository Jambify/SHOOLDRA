<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon with fallbacks for Chrome -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />

    <!-- Google Search Console Verification Placeholder -->
    <!-- TODO: Replace with actual verification code from Google Search Console -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->

    <!-- Bare placeholder title — PageHelmet (via react-helmet-async) sets the
         real title/description/keywords/canonical/OG/Twitter tags on every
         route. Do NOT add a static title tag or meta description/OG/Twitter
         tags here again. -->
    <title>SCHOOLDRA</title>

    <meta name="author" content="SCHOOLDRA" />
    <meta name="language" content="English" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="revisit-after" content="7 days" />

    <!-- iOS PWA Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SCHOOLDRA" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7c3cff" />
    <meta name="background_color" content="#090a16" />

    <!-- Google Fonts — non-blocking: matches index.css (--font-display / --font-body / --font-mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("schooldra-theme");
          var supportDarkMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches === true;
          if (!theme && supportDarkMode) theme = "dark";
          if (!theme && !supportDarkMode) theme = "light";

          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.body.style.backgroundColor = "#faf8ff";
          } else {
            document.documentElement.removeAttribute("data-theme");
            document.body.style.backgroundColor = "#0a0a0f";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data: EducationalPlatform (agentic browsing + SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "additionalType": "https://schema.org/WebApplication",
        "name": "SCHOOLDRA",
        "alternateName": "Schooldra",
        "url": "https://www.schooldra.com",
        "logo": "https://www.schooldra.com/SCHOOLDRA.LOGO.webp",
        "image": "https://www.schooldra.com/SCHOOLDRA.LOGO.webp",
        "description": "AI-powered JAMB/UTME exam preparation platform for Nigerian secondary students — past questions, mock exams, AI tutoring, and performance tracking",
        "sameAs": [
          "https://www.instagram.com/shreda_shadrach",
          "https://x.com/sha_dra_ch"
        ],
        "potentialAction": {
          "@type": "JoinAction",
          "target": "https://www.schooldra.com/signup"
        },
        "creator": {
          "@type": "Person",
          "name": "Shadrach"
        },
        "audience": {
          "@type": "EducationalAudience",
          "educationalRole": "student",
          "audienceType": "Secondary School Students"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "email": "support@schooldra.com"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "NG"
        },
        "areaServed": "NG"
      }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SCHOOLDRA",
        "url": "https://www.schooldra.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.schooldra.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body style="background-color: #0a0a0f; margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      try {
        const saved = localStorage.getItem("schooldra-theme");
        const theme = saved || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </body>
</html>
